# =============================================================================
# AI LITERACY CTF - KUBERNETES DEPLOYMENT
# =============================================================================
#
# This manifest creates a Deployment that runs the CTF web application.
#
# WHAT THIS DOES:
# - Creates 2 replicas of the application for high availability
# - Defines resource limits for predictable performance
# - Sets up health checks for automatic recovery
# - Adds labels for Wiz security scanning
#
# APPLY WITH:
#   kubectl apply -f deployment.yaml
#
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-literacy-ctf
  labels:
    app: ai-literacy-ctf
    # Labels for Wiz identification
    environment: production
    team: security-training
    component: web
spec:
  # Number of pod replicas - adjust based on expected traffic
  replicas: 2

  selector:
    matchLabels:
      app: ai-literacy-ctf

  template:
    metadata:
      labels:
        app: ai-literacy-ctf
        environment: production
      # Annotations can be used by Wiz for additional context
      annotations:
        description: "AI Literacy CTF - Prompt Injection Training"

    spec:
      # Security context for the pod
      # The container runs as the nginx user (UID 101) defined in the Dockerfile
      securityContext:
        runAsNonRoot: true
        fsGroup: 101

      containers:
        - name: ai-literacy-ctf
          # Image reference - update with your registry
          # For AWS ECR: <account-id>.dkr.ecr.<region>.amazonaws.com/ai-literacy-ctf:latest
          image: ai-literacy-ctf:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          # Resource limits - adjust based on your cluster capacity
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"

          # Liveness probe - restarts container if it becomes unhealthy
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe - removes from service if not ready
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Security context for the container
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # nginx needs to write temp files
            capabilities:
              drop:
                - ALL

          # Volume mounts if needed
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run

      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}

      # Optional: Node selector for specific node pools
      # nodeSelector:
      #   workload-type: web

      # Optional: Tolerations for specific taints
      # tolerations:
      #   - key: "dedicated"
      #     operator: "Equal"
      #     value: "web"
      #     effect: "NoSchedule"
